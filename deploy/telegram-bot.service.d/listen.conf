# Override de systemd SOLO para el servidor de QA donde también corre
# telegram_bot_operativos en Docker: el contenedor llama a la API interna
# (/internal/notify-boarding) por host.docker.internal:8010, así que el bot
# debe escuchar fuera de 127.0.0.1. El acceso se limita con ufw a las redes
# de Docker (ver README, sección 12). En un VPS sin Docker NO instalar esto.
#
# Instalación:
#   sudo mkdir -p /etc/systemd/system/telegram-bot.service.d
#   sudo cp deploy/telegram-bot.service.d/listen.conf /etc/systemd/system/telegram-bot.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart telegram-bot
[Service]
ExecStart=
ExecStart=/opt/odoo/custom/telegram_boarding_bot/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8010
