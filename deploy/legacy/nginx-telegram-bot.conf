# nginx — Bot de Telegram (pase de abordaje)
# Copiar a /etc/nginx/sites-available/telegram-bot.conf y habilitar:
#   sudo ln -s /etc/nginx/sites-available/telegram-bot.conf /etc/nginx/sites-enabled/
# Certificado: sudo certbot --nginx -d bot.viacotur.com

server {
    listen 80;
    server_name bot.viacotur.com;
    # Desafío de certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bot.viacotur.com;

    ssl_certificate     /etc/letsencrypt/live/bot.viacotur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.viacotur.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Límite de tamaño de payload de Telegram (fotos de QR)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
