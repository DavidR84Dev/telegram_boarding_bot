# nginx — VPS dedicado al bot (sin Odoo local)
#
# bot.viacotur.com → FastAPI 127.0.0.1:8010  (webhook de Telegram y API interna)
#
# Usado por: sudo ./deploy/deploy-nginx.sh --bot-only -e <email>
# DNS: A bot.viacotur.com → IP pública de este VPS
# TLS: certbot --nginx -d bot.viacotur.com (lo emite el script)

# ---------------------------------------------------------------------------
# HTTP — redirección + desafío ACME
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bot.viacotur.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — webhook de Telegram + API interna (Odoo.sh -> bot)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.viacotur.com;

    ssl_certificate     /etc/letsencrypt/live/bot.viacotur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.viacotur.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Fotos de QR desde Telegram
    client_max_body_size 20m;

    # Webhook de Telegram: Telegram valida su propio secret en la cabecera.
    location = /telegram/webhook {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API interna (Odoo.sh -> bot). Protección: TLS + Bearer internal_token.
    # Odoo.sh no tiene IP de salida fija, por lo que la restricción por IP es
    # OPCIONAL. Solo si Odoo pasa a tener IP fija, descomenta las líneas allow/deny.
    location /internal/ {
        # allow 203.0.113.10;   # IP fija de Odoo (ejemplo)
        # deny  all;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health para monitorización externa
    location = /health {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
    }

    # Cualquier otra ruta no es pública
    location / {
        return 404;
    }
}
