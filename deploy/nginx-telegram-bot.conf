# nginx — Telegram Boarding Bot + Odoo público (Opción C: sin cloudflared)
#
# bot.viacotur.com  → FastAPI 127.0.0.1:8010  (webhook Telegram)
# odoo.viacotur.com → Odoo     127.0.0.1:8079  (payload QR /form/accept/<token>)
#
# DNS (GoDaddy): ambos A → IP pública del servidor (p. ej. 181.205.45.154)
# TLS: certbot --nginx -d bot.viacotur.com -d odoo.viacotur.com

# ---------------------------------------------------------------------------
# HTTP — redirección + desafío ACME
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bot.viacotur.com odoo.viacotur.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Bot — webhook Telegram (solo loopback)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.viacotur.com;

    ssl_certificate     /etc/letsencrypt/live/bot.viacotur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.viacotur.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Fotos de QR desde Telegram
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# Odoo — validación pública del QR ({ODOO_PUBLIC_URL}/form/accept/<token>)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odoo.viacotur.com;

    ssl_certificate     /etc/letsencrypt/live/bot.viacotur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.viacotur.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
